# electron-builder config — Linux/Fedora (RPM) packaging.
#
# Layout note (load-bearing): this app's package.json lives in electron/, but
# main.js serves pages/ and static/ from the REPO ROOT (PROJECT_ROOT =
# path.resolve(__dirname, '..')). In a packaged app __dirname is
# .../resources/app.asar, so PROJECT_ROOT resolves to .../resources — which is
# exactly where extraResources land. So we ship pages/ and static/ as
# extraResources (to "pages"/"static") and the existing path logic in main.js
# works unchanged, in dev and when packaged.
#
# Native module: better-sqlite3-multiple-ciphers ships its Electron-ABI prebuild
# (parked by scripts/setup-native-abis.js). We do NOT rebuild from source
# (no C toolchain on this machine) — npmRebuild is off — and we unpack the
# package from the asar so the .node can be dlopen'd at runtime.

# appId is the identity the released builds (up to 0.9.8, named "Aventurine")
# shipped with, kept through the rename to Aventurine Manage on purpose. The
# Windows installer derives its install GUID from it and macOS its bundle ID, so
# keeping it means a new build upgrades an existing install in place instead of
# installing a second app beside it. Never change it.
appId: com.aventurineapp.aventurine
# The display name: window, installer, shortcuts, the /opt and Program Files
# folders. NOT the profile folder the data lives in, which is named after
# package.json "name" (see migrateLegacyProfile in main.js).
productName: Aventurine Manage
copyright: Copyright © 2026 Aventurine

directories:
  output: dist
  buildResources: build

# App-root files (electron/). Defaults already include these; listed
# explicitly so an accidental addition under electron/ isn't shipped silently.
files:
  - main.js
  - preload.js
  - updater.js
  - updatePolicy.js
  - backend/**/*
  - node_modules/**/*
  - package.json

# pages/ and static/ live one level up from the app root — ship them as
# resources so PROJECT_ROOT/{pages,static} resolves in the packaged app.
extraResources:
  - from: ../pages
    to: pages
  - from: ../static
    to: static

asar: true
asarUnpack:
  - node_modules/better-sqlite3-multiple-ciphers/**/*

# The prebuilt Electron-ABI binary is already in place; rebuilding would need a
# C toolchain we don't have. Ship node_modules as-is.
npmRebuild: false
buildDependenciesFromSource: false

# Update feed for the in-app updater (../updater.js). electron-builder bakes
# this into each build as resources/app-update.yml and writes the release
# metadata electron-updater reads: latest.yml (Windows) and latest-linux.yml
# (one file listing the AppImage, deb and rpm). The repository is public, so the
# shipped app needs no token. updatePolicy.js names the same repository for the
# macOS / dev check; change both together.
#
# electron-builder itself still never uploads anything: CI builds with
# `--publish never`, and the `release` job in .github/workflows/release.yml
# attaches the installers AND that metadata (plus the .blockmap files used for
# differential downloads), so one place stays in charge of what ships. A
# release missing latest*.yml looks like "no update" to every installed copy.
#
# Releases are created as drafts, and the feed shows only published releases,
# so nothing reaches installed copies until the draft is published by hand.
publish:
  provider: github
  owner: aventurine-app
  repo: aventurine-manage
  releaseType: release

linux:
  target:
    - AppImage
    - rpm
    - deb
  icon: build/icon.png
  category: Office;Finance
  synopsis: Desktop personal-finance app
  # `>-`, not `>`: a trailing newline ends up as a literal "\n" in the .desktop
  # file's Comment.
  description: >-
    Aventurine Manage — a private, local-first desktop personal-finance app.
    Cash flow, balance sheet, transactions and forecasting,
    backed by a single encryptable SQLite database you control.
  # Window ↔ launcher association. Electron takes the window's WM_CLASS / Wayland
  # app_id from package.json "desktopName" (aventurine-manage.desktop), and with
  # this on electron-builder names the .desktop file and its StartupWMClass from
  # the same field, so the three cannot drift apart. Without desktopName, Electron
  # falls back to the product name, whose space matches nothing.
  syncDesktopName: true

appImage:
  # Self-contained, distro-agnostic single file.
  artifactName: ${name}-${version}.${arch}.${ext}

# The Linux packages were named "aventurine" up to 0.9.8. Declaring that package
# replaced lets dnf / apt swap it out when this one is installed, instead of
# leaving both apps installed side by side.
rpm:
  # fpm/rpmbuild fills these out; depends are the shared libs Electron needs.
  artifactName: ${name}-${version}.${arch}.${ext}
  fpm: ['--replaces', 'aventurine']

deb:
  fpm: ['--replaces', 'aventurine', '--conflicts', 'aventurine']

# Windows is cross-built from this Linux host. Two prerequisites, both handled
# outside this file: (1) the win32-x64 native binary must be parked first —
# `npm run dist:win` runs scripts/setup-win-abi.js to do that; (2) electron's
# .exe icon/version stamping (rcedit) needs Wine installed on the host.
#
# ── SECURITY: Windows installers are NOT Authenticode-signed yet ──────────────
# Deliberate, recorded gap (revisit before wider Windows distribution / GA).
# With no signing block:
#   • Users see a SmartScreen "unknown publisher" warning on first install.
#   • The in-app updater has no publisher signature to verify, so an update's
#     integrity rests on the SHA-512 in latest.yml, fetched with the installer
#     from the same GitHub release over HTTPS. An update is exactly as
#     trustworthy as the GitHub account that publishes the release.
# To close it, add code signing (for new — 2023+ — certs the key must live on
# hardware or a cloud service; file-based .pfx OV certs are no longer issued):
#   • Azure Trusted Signing  -> win.azureSignOptions (signs from CI/Linux)
#   • Cloud CSP / hardware    -> win.certificateSubjectName / provider tooling
# then set win.publisherName to the certificate's subject, so electron-updater
# refuses any update not signed by it.
win:
  target:
    - nsis
  icon: build/icon.ico
  artifactName: ${name}-${version}-setup.${ext}

nsis:
  oneClick: false                       # assisted installer, not silent one-click
  perMachine: false                     # per-user install, no admin prompt
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Aventurine Manage

# macOS must be built ON macOS — there is no Wine-style cross-build for it
# (hdiutil, the .app bundle layout and codesign are all Apple tooling), so
# .github/workflows/release.yml runs this target in its own macos-latest job
# while Linux and Windows come off the one Linux runner.
#
# Both arches ship: the runner is Apple Silicon, so arm64 is native and x64 is
# a cross-build. `npm run dist:mac` parks BOTH darwin native binaries first
# (scripts/setup-mac-abi.js) — without that the Intel .dmg would carry an
# arm64 better_sqlite3.node and die on first DB open.
#
# The icon is build/icon.png (the same 512px render the Linux target uses):
# electron-builder converts it to .icns at build time, so there is no third
# committed icon to keep in sync and the make-icons.js freshness stamp keeps
# covering macOS for free.
#
# ── SECURITY: macOS builds are ad-hoc signed, NOT notarized ──────────────────
# Deliberate, recorded gap — the same one the win: block above records, and a
# louder one, because macOS enforces harder than SmartScreen does. Signing for
# real needs a paid Apple Developer ID, which this project doesn't hold yet
# (revisit before wider macOS distribution / GA).
#
# `identity: '-'` is ad-hoc signing, not "unsigned": Apple Silicon refuses to
# execute a binary carrying no signature at all, so the alternative (identity:
# null, which makes electron-builder skip signing outright) ships an arm64 .dmg
# whose app cannot launch. Ad-hoc satisfies the loader but not Gatekeeper, so a
# downloaded build is still quarantined — the user opens it via right-click →
# Open, or clears the flag with `xattr -dr com.apple.quarantine`.
#
# It also rules out updating in place: the macOS updater (Squirrel.Mac) only
# accepts an update signed by the same Developer ID as the running app, and
# needs a zip target this config doesn't build. So macOS copies only check for
# a new version and link to the download page (updatePolicy.js, 'notify'). With
# a Developer ID, add a zip target and upload latest-mac.yml to enable it.
#
# hardenedRuntime stays OFF: it is only meaningful under a real Developer ID,
# and ad-hoc + hardened runtime needs the disable-library-validation
# entitlement or the app fails to load its own native module at launch.
mac:
  target:
    - dmg
  icon: build/icon.png
  category: public.app-category.finance
  identity: '-'           # ad-hoc; see the SECURITY note above
  hardenedRuntime: false  # only meaningful with a real Developer ID
  notarize: false         # no Apple Developer account

dmg:
  # Arch in the name: the arm64 and x64 builds land in the same dist/ dir.
  artifactName: ${name}-${version}-${arch}.${ext}
